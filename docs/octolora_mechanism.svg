<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>How OctoLoRA's gate works</title>
  <desc>The adapter's forward computation—input through a frozen base weight plus a small trainable A-then-B path, summed into the output—is identical for plain LoRA, LoRA+, and OctoLoRA. The three methods only differ in how much each training step updates A versus B: a fixed shared rate, a fixed 16x ratio, or a ratio recalculated every step from recent gradient sizes.</desc>

  <rect x="0" y="0" width="920" height="600" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="460" y="24" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e293b">
    The forward pass — the same in all three methods
  </text>

  <!-- input -->
  <rect x="30" y="95" width="110" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="85" y="125" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e293b">input x</text>

  <!-- frozen W -->
  <rect x="230" y="35" width="220" height="55" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="340" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e293b">Frozen base weight W</text>
  <text x="340" y="76" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">(never trained)</text>

  <!-- A -->
  <rect x="230" y="150" width="90" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="275" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">A</text>

  <!-- B -->
  <rect x="370" y="150" width="90" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="415" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="600" fill="#1e3a8a">B</text>

  <text x="345" y="222" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#64748b">adapter path (small, trainable)</text>

  <!-- plus -->
  <circle cx="590" cy="110" r="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="590" y="117" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#1e293b">+</text>

  <!-- output -->
  <rect x="650" y="85" width="110" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="705" y="115" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e293b">output</text>

  <!-- arrows -->
  <line x1="140" y1="118" x2="222" y2="65" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="128" x2="222" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="175" x2="362" y2="175" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="450" y1="165" x2="574" y2="122" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="70" x2="574" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="612" y1="110" x2="642" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="30" y1="250" x2="890" y2="250" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="275" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#475569">
    All three methods below share exactly this picture. They only differ in HOW MUCH each
  </text>
  <text x="460" y="292" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#475569">
    training step updates A vs. B — none of them change this diagram.
  </text>

  <!-- card 1: plain LoRA -->
  <rect x="30" y="320" width="270" height="210" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="50" y="350" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e293b">Plain LoRA</text>
  <text x="50" y="370" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b">one shared learning rate</text>
  <text x="50" y="400" font-family="sans-serif" font-size="13" fill="#334155">A and B are updated by</text>
  <text x="50" y="420" font-family="sans-serif" font-size="13" fill="#334155">the same step size,</text>
  <text x="50" y="440" font-family="sans-serif" font-size="13" fill="#334155">every step, all training.</text>

  <!-- card 2: LoRA+ -->
  <rect x="325" y="320" width="270" height="210" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="345" y="350" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e293b">LoRA+</text>
  <text x="345" y="370" font-family="sans-serif" font-size="12" font-style="italic" fill="#64748b">fixed 16x ratio (Hayou et al.)</text>
  <text x="345" y="400" font-family="sans-serif" font-size="13" fill="#334155">B always gets an update</text>
  <text x="345" y="420" font-family="sans-serif" font-size="13" fill="#334155">16x bigger than A's —</text>
  <text x="345" y="440" font-family="sans-serif" font-size="13" fill="#334155">fixed for the whole run.</text>

  <!-- card 3: OctoLoRA gate (highlighted) -->
  <rect x="620" y="320" width="270" height="210" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="640" y="350" font-family="sans-serif" font-size="16" font-weight="600" fill="#1e3a8a">OctoLoRA's gate</text>
  <text x="640" y="370" font-family="sans-serif" font-size="12" font-style="italic" fill="#3b5578">ratio recalculated every step</text>
  <text x="640" y="398" font-family="sans-serif" font-size="13" fill="#1e3a8a">Each step, measure how</text>
  <text x="640" y="416" font-family="sans-serif" font-size="13" fill="#1e3a8a">large A's and B's recent</text>
  <text x="640" y="434" font-family="sans-serif" font-size="13" fill="#1e3a8a">gradients are, then adjust</text>
  <text x="640" y="452" font-family="sans-serif" font-size="13" fill="#1e3a8a">how much of A's gradient</text>
  <text x="640" y="470" font-family="sans-serif" font-size="13" fill="#1e3a8a">passes through.</text>

  <rect x="30" y="552" width="860" height="36" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
  <text x="460" y="575" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#713f12">
    Important: the gate only changes training updates. B(A(x)) above is identical in all three cases — during training and at inference.
  </text>
</svg>
